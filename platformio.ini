; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32-c3]
platform = espressif32@8.0.0
board = esp32-c3-devkitm-1
framework = arduino
; macOS / Linux: GIT_VERSION comes from a POSIX shell command.
; On Windows use the esp32-c3-windows environment below.
build_flags = !echo '-Os -fno-exceptions -D ARDUINO_USB_CDC_ON_BOOT=1 -D ARDUINO_USB_MODE=1 -D AG_LOG_LEVEL=AG_LOG_LEVEL_INFO -D ARDUINOJSON_ENABLE_PROGMEM=0 -include lwip/err.h -D GIT_VERSION=\\"'$(git describe --tags --always --dirty)'\\"'
board_build.partitions = partitions.csv
extra_scripts = post:tools/pio_check_bin_size.py
monitor_speed = 115200
lib_deps =
	aglib=symlink://${PROJECT_DIR}
	EEPROM
	WebServer
	ESPmDNS
	FS
	SPIFFS
	HTTPClient
	NetworkClientSecure
	Update
	DNSServer
	h2zero/NimBLE-Arduino@^2.1.0
	sensirion/Sensirion Core@^0.7.3
	sensirion/Sensirion UART SPS30@^1.0.0
	bblanchon/ArduinoJson@^7.4.3

; Windows: same as esp32-c3, but GIT_VERSION is set by a Python script
; This env extends esp32-c3 rather than replacing it to support Windows Host Compile.
[env:esp32-c3-windows]
extends = env:esp32-c3
extra_scripts =
	pre:tools/pio_git_version.py
	post:tools/pio_check_bin_size.py
build_flags = -Os -fno-exceptions -D ARDUINO_USB_CDC_ON_BOOT=1 -D ARDUINO_USB_MODE=1 -D AG_LOG_LEVEL=AG_LOG_LEVEL_INFO -D ARDUINOJSON_ENABLE_PROGMEM=0 -include lwip/err.h

[env:esp8266]
platform = espressif8266
board = d1_mini
framework = arduino
monitor_speed = 115200
lib_deps =
	aglib=symlink://${PROJECT_DIR}
	EEPROM
	ESP8266HTTPClient
	ESP8266WebServer
	DNSServer
;
monitor_filters = time

[platformio]
src_dir = examples/OneOpenAir
; src_dir = examples/BASIC
; src_dir = examples/DiyProIndoorV4_2
; src_dir = examples/DiyProIndoorV3_3
; src_dir = examples/TestCO2
; src_dir = examples/TestPM
; src_dir = examples/TestSht
